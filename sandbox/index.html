<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ffwd addon sandbox</title>
<!-- Sandbox: nagemaakte ffwd-pagina's (zelfde opbouw en Tailwind-classes als app.ffwd.school, 13-10-2026) met een nep-API:
     een studentpagina, de lijst met assessments (opbouw van /sessions, 13-10-2026) en een assessmentpagina. Laadt dezelfde bestanden als de extensie.
     Alleen verzonnen data; openen als lokaal bestand. -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="stylesheet" href="../extensie/ec-overzicht.css">
<link rel="stylesheet" href="../extensie/statuskaart.css">
<link rel="stylesheet" href="../extensie/assessment-aside.css">
<link rel="stylesheet" href="../extensie/assessmentlijst.css">
<style>
  /* Wat ffwd zelf in zijn eigen CSS heeft (geen Tailwind): menu-items en de labels bovenaan */
  a.light { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; color: #374151; }
  a.light:hover, a.light.router-link-active { background: #f3f4f6; font-weight: 600; }
  ul.labels li { white-space: nowrap; padding: 2px 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 9999px; font-size: 13px; color: #6b7280; }
  ul.labels li strong { color: #111827; margin-left: 4px; }

  /* Bedieningsbalk van de sandbox: hoort niet bij ffwd. Linksonder, zodat hij de aside rechts niet bedekt */
  #sandbox-balk {
    position: fixed; left: 16px; bottom: 16px; z-index: 60; width: 290px; padding: 12px 14px;
    background: #fffbea; border: 2px dashed #b45309; border-radius: 10px; font-size: 13px; color: #111827;
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  #sandbox-balk b { font: 700 11px ui-monospace, Menlo, monospace; letter-spacing: .06em; color: #b45309; }
  #sandbox-balk label { display: block; margin-top: 8px; }
  #sandbox-balk select { width: 100%; margin-top: 2px; padding: 4px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
  #sandbox-balk button { margin-top: 8px; padding: 3px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
  #sandbox-balk .uitleg { margin-top: 6px; font-size: 11px; color: #6b7280; }
</style>
</head>
<body>
<div id="app"><div id="laag"></div></div>

<div id="sandbox-balk">
  <b>SANDBOX · VERZONNEN DATA</b>
  <label>Pagina
    <select id="kies-pagina"></select>
  </label>
  <label><input type="checkbox" id="traag"> Traag laden (2 seconden)</label>
  <label><input type="checkbox" id="fout"> API geeft een fout</label>
  <button id="herteken" type="button">Vue tekent de pagina opnieuw</button>
  <p class="uitleg">Na het wisselen van traag of fout: klik op Vernieuw in de kaart. Op een assessment: knop EC rechts.</p>
</div>

<script src="fixtures.js"></script>
<script>
  // ---------- Nep-API: beantwoordt de queries van de extensie met verzonnen data ----------
  const F = FfwdFixtures;
  const wacht = ms => new Promise(r => setTimeout(r, ms));
  const studentVan = id => F.studenten.find(s => s.id === id);
  const komend = a => new Date(a.startingAt) > new Date();
  // Een verzonnen assessment zoals de API van ffwd het teruggeeft
  const sessieVoorApi = a => ({
    id: a.id, title: a.title, kind: a.kind, context: a.context, state: a.finalized ? 'finalized' : 'open', finalized: a.finalized,
    owned: a.docenten[0] === 'd-jij', // eigenaar = eerste docent; d-jij is de ingelogde docent
    startingAt: a.startingAt, deadlineAt: a.deadlineAt,
    students: a.studenten.map(studentVan).map(({ id, name, studentId }) => ({ id, name, studentId })),
    teachers: a.docenten.map(id => F.docenten.find(d => d.id === id)),
    assessors: a.docenten.map((id, i) => ({ id: 'as-' + id, role: i ? 'member' : 'owner', teacherId: id })),
    assessees: a.studenten.map(id => ({ id: 'ae-' + id, status: a.pending.includes(id) ? 'pending' : 'completed', student: { id } })),
  });
  window.fetch = async (url, opties) => {
    const { query, variables } = JSON.parse(opties.body);
    await wacht(document.getElementById('traag').checked ? 2000 : 150);
    if (document.getElementById('fout').checked) return { json: async () => ({ errors: [{ message: 'gesimuleerde API-fout' }] }) };
    const student = studentVan(variables?.id);
    const data = {};
    if (/\bcompetencies\b/.test(query)) data.competencies = F.competenties;
    if (/\bprograms\b/.test(query)) data.programs = F.programmas;
    if (/\bgroups\b/.test(query)) data.groups = [...new Set(F.studenten.map(s => s.groep))].map((g, i) => ({
      id: 'g' + i, title: g, students: F.studenten.filter(s => s.groep === g).map(({ id, name, studentId }) => ({ id, name, studentId })),
    }));
    if (/\bstudentResults\b/.test(query)) data.studentResults = { goals: student?.doelen || [] };
    // Met studentId: de assessments van die student; zonder: de lijst van de ingelogde docent (komend en afgerond)
    if (variables?.id) {
      if (/\bpastSessions\b/.test(query)) data.pastSessions = (student?.sessies || []).map((title, i) => ({ title, startingAt: `2026-0${i + 1}-15T10:00:00Z` }));
    } else {
      if (/\bupcomingSessions\b/.test(query)) data.upcomingSessions = F.assessments.filter(komend).map(sessieVoorApi);
      if (/\bpastSessions\b/.test(query)) data.pastSessions = F.assessments.filter(a => !komend(a)).map(sessieVoorApi);
    }
    if (/\bsession\s*\(/.test(query)) {
      const a = F.assessments.find(x => x.id === variables?.id);
      data.session = a && { id: a.id, title: a.title, students: a.studenten.map(studentVan).map(({ id, name, studentId }) => ({ id, name, studentId })) };
    }
    return { json: async () => ({ data }) };
  };

  // ---------- Nagemaakte router: een lokaal bestand heeft geen /students/…-pad ----------
  // Hash: #students/<id>, #sessions of #sessions/<id> (een kale #<id> is een student, zoals eerder)
  const uitHash = h => !h ? '/students/' + F.studenten[0].id : h.includes('/') || h === 'sessions' ? '/' + h : '/students/' + h;
  let pad = uitHash(location.hash.slice(1));
  let laatsteStudent = F.studenten[0].id;
  const params = new URLSearchParams(location.search);
  // ?cumlaude=aan: cum laude vooraf aan voor de student in de hash; ?aside=open: de aside vooraf open (voor screenshots)
  try {
    if (params.get('cumlaude') === 'aan') localStorage.setItem('cumLaude:' + pad.split('/').pop(), 'true');
    if (params.get('aside') === 'open') localStorage.setItem('aside:open', 'true');
  } catch {}
  window.ffwdSandboxPad = () => pad;
  history.pushState = (_staat, _titel, url) => naar(String(url));

  const kies = document.getElementById('kies-pagina');
  kies.innerHTML = `<optgroup label="Studentpagina">${F.studenten.map(s => `<option value="/students/${s.id}">${s.name} — ${s.rol}</option>`).join('')}</optgroup>
    <optgroup label="Assessments"><option value="/sessions">Lijst met assessments</option>${F.assessments.map(a => `<option value="/sessions/${a.id}">${a.title}</option>`).join('')}</optgroup>`;

  function naar(nieuwPad) {
    pad = nieuwPad;
    const student = pad.match(/^\/students\/([^/]+)/)?.[1];
    if (student) laatsteStudent = student;
    history.replaceState(null, '', '#' + pad.slice(1));
    kies.value = pad;
    herteken();
    dispatchEvent(new PopStateEvent('popstate'));
  }

  // Zoals Vue: de hele pagina opnieuw, dus ook de kaart weg (de extensie moet hem terugzetten)
  function herteken() {
    const student = studentVan(pad.match(/^\/students\/([^/]+)/)?.[1]);
    const assessment = F.assessments.find(a => a.id === pad.match(/^\/sessions\/([^/]+)/)?.[1]);
    document.getElementById('laag').innerHTML = assessment ? assessmentPagina(assessment) : menuPagina(student);
  }

  // Studentpagina en de lijst met assessments: zijbalk links, inhoud rechts
  function menuPagina(s) {
    const menu = (naam, naarPad, actief) => `<li><a href="#" class="light full-width${actief ? ' router-link-active' : ''}" data-pad="${naarPad}"><span>${naam}</span></a></li>`;
    return `<div>
      <aside class="p-4 pb-0 space-y-4 md:pd-4 md:fixed md:space-y-7 md:w-60 md:h-screen md:flex md:flex-col">
        <div class="flex items-center"><div><h2 class="font-bold">Sandbox</h2><h3>Docent (verzonnen)</h3></div></div>
        <nav class="md:flex-grow md:flex md:flex-col">
          <a class="flex items-center mb-3"><h4 class="font-bold">Menu</h4></a>
          <div class="md:block md:flex-grow"><ul class="md:flex md:flex-col md:h-full md:pb-4">
            ${menu('Studenten', '/students/' + laatsteStudent, !!s)}${menu('Assessments', '/sessions', !s)}
            <li class="mt-auto"><ul><li><a href="#" class="light full-width"><span>Uitloggen</span></a></li></ul></li>
          </ul></div>
        </nav>
      </aside>
      <section class="p-4 md:p-14 md:ml-60 md:min-h-screen md:bg-gray-100">
        <h2 class="first-letter:uppercase mb-4 text-xl md:mt-4 md:mb-14 md:text-4xl">${s ? 'Studenten' : 'Assessments'}</h2>
        ${s ? `<div class="max-w-2xl"><div class="mt-6">${studentInhoud(s)}</div></div>` : assessmentLijst()}
      </section>
    </div>`;
  }

  function studentInhoud(s) {
    return `<h2 class="mb-4 text-xl font-bold flex items-center">${s.name}</h2>
      <div class="space-y-6">
        <ul class="labels mb-2 -mx-4 px-4 flex gap-2 overflow-auto">
          <li>Studentnummer:<strong>${s.studentId ?? 'onbekend'}</strong></li>
          <li>Groep:<strong>${s.groep}</strong></li>
          <li>Scenario:<strong>${s.rol}</strong></li>
        </ul>
        <div><div class="space-y-6 max-w-4xl">
          <div class="grid gap-2 md:grid-cols-2 lg:grid-cols-3"></div>
          <h2 class="mb-2 text-sm font-bold flex"><span>Afgeronde assessments</span><a class="ml-auto font-normal underline text-sky-500 cursor-pointer">Toon alles</a></h2>
          <div class="grid gap-2 md:grid-cols-2 lg:grid-cols-3">
            ${s.sessies.map(t => `<div class="flex flex-col p-4 bg-white rounded-md border border-gray-200">
              <h2 class="text-xl">${t}</h2><h3 class="text-sm text-gray-500">Individueel assessment</h3>
              <div class="my-4"><dl class="grid grid-cols-3 text-sm"><dt>Datum:</dt><dd class="col-span-2">15-01-2026</dd></dl></div>
              <p class="mt-auto text-right"><a href="#" class="text-sky-500">Bekijk</a></p></div>`).join('') || '<p class="text-sm text-gray-500">Nog geen afgeronde assessments.</p>'}
          </div>
        </div></div>
      </div>`;
  }

  // Zoals ffwd: een link voor een nieuw assessment, dan de komende en de afgeronde assessments als blokken.
  // De extensie zet haar schakelaar en rijen vóór div.space-y-6.
  function assessmentLijst() {
    const fmt = d => new Date(d).toLocaleDateString('nl-NL');
    const blok = a => `<div class="flex flex-col p-4 bg-white rounded-md border border-gray-200">
      <h2 class="text-xl">${a.title}</h2><h3 class="text-sm text-gray-500">${a.soort}</h3>
      <div class="my-4"><dl class="grid grid-cols-3 text-sm"><dt class="overflow-hidden whitespace-nowrap text-ellipsis">Datum:</dt><dd class="col-span-2">${fmt(a.startingAt)}</dd></dl></div>
      <p class="mt-auto text-right"><a href="#" class="text-sky-500" data-pad="/sessions/${a.id}">Bekijk</a></p></div>`;
    const kop = t => `<h2 class="mb-2 text-sm font-bold flex"><span>${t}</span></h2>`;
    const komende = F.assessments.filter(komend), afgerond = F.assessments.filter(a => !komend(a));
    return `<p class="mb-6"><a href="#" class="default"><span>+ Nieuw assessment</span></a></p>
      <div class="space-y-6 max-w-4xl">
        ${komende.length ? kop('Komende assessments') : ''}<div class="grid gap-2 md:grid-cols-2 lg:grid-cols-3">${komende.map(blok).join('')}</div>
        ${kop('Afgeronde assessments')}<div class="grid gap-2 md:grid-cols-2 lg:grid-cols-3">${afgerond.map(blok).join('')}</div>
      </div>`;
  }

  // Assessmentpagina: vaste balk bovenin, kop met gegevens, tabel met een rij per student, feedback (opbouw van ffwd)
  function assessmentPagina(a) {
    const studenten = a.studenten.map(studentVan);
    const initialen = s => s.name === 'Onbekend' ? '??' : s.name.split(' ').map(w => w[0]).filter(c => c === c.toUpperCase()).slice(0, 2).join('');
    return `<div>
      <header class="overflow-hidden p-4 w-full bg-white border-b border-gray-200 md:fixed md:z-20">
        <span class="float-left"><a href="#" class="inline-flex items-center p-2 -m-2 space-x-2 cursor-pointer" data-pad="/sessions"><span>← Assessments</span></a></span>
        <span class="float-right text-sm">Docent (verzonnen)</span>
      </header>
      <div><section class="md:min-h-screen md:bg-gray-100">
        <header class="p-4 bg-white md:p-14 md:pt-28 md:border-b md:border-gray-200"><div class="max-w-4xl">
          <div class="md:grid md:grid-cols-5">
            <div class="md:col-span-3"><h2 class="md:text-3xl">${a.title}</h2><h3 class="text-gray-500">${a.soort}</h3></div>
            <div class="my-3 md:col-span-2 md:my-0 md:text-right"><span class="text-xs inline-block">Gepland<br>15-01-2026 10:00</span></div>
          </div>
          <div class="mt-2 space-y-2 md:grid md:grid-cols-4 md:mt-4 md:space-y-0 md:text-sm">
            <div><h4 class="text-xs text-gray-500 md:mb-1">Status</h4>Open</div>
            <div><h4 class="text-xs text-gray-500 md:mb-1">Context</h4>Sandbox</div>
            <div class="col-span-2"><h4 class="text-xs text-gray-500 md:mb-1">Assessoren</h4>Docent (verzonnen)</div>
          </div>
        </div></header>
        <div class="max-w-5xl">
          <h3 class="p-4 md:px-14 md:pt-14 md:mb-4 md:text-xl">Doelen</h3>
          <div class="overflow-x-auto px-4 pb-5 w-full md:px-14 whitespace-nowrap">
            <table class="table-fixed min-w-full text-sm bg-white border border-gray-200 inline-table">
              <thead class="text-xs text-left"><tr><th class="py-2 px-3 bg-gray-100 border-b border-gray-200">Student</th>
                ${F.competenties.map(c => `<th class="py-2 px-3 bg-gray-100 border-b border-gray-200">${c.title}</th>`).join('')}</tr></thead>
              <tbody>${studenten.map(s => `<tr><td class="py-4 px-3 align-top"><div class="flex gap-1 items-center space-x-2 whitespace-nowrap">
                  <i class="float-left py-1 w-6 text-xs not-italic font-semibold text-center bg-gray-300 rounded-full">${initialen(s)}</i>
                  <span class="flex flex-col"><span class="text-xs">${s.name}</span><span class="text-xs text-gray-400">${s.studentId ?? ''}</span></span></div></td>
                  ${F.competenties.map(() => '<td class="py-3 px-3 align-top text-gray-400">–</td>').join('')}</tr>`).join('')}</tbody>
            </table>
          </div>
          <div class="p-4 space-y-6 max-w-5xl md:px-14">
            <div class="p-4 pt-0 bg-white border border-gray-200">
              <div class="px-4 pt-3 -mx-4 mb-4 border-t-4 border-t-sky-500"><header class="flex items-center text-xl"><span class="mr-6">Feedback</span></header></div>
              <div class="h-28 border border-gray-300" contenteditable="true" aria-label="Feedback (nagemaakte editor)"></div>
            </div>
          </div>
        </div>
      </section></div>
    </div>`;
  }

  kies.addEventListener('change', () => naar(kies.value));
  document.getElementById('herteken').addEventListener('click', herteken);
  document.addEventListener('click', e => {
    const link = e.target.closest('[data-pad]');
    if (!link) return;
    e.preventDefault();
    naar(link.dataset.pad);
  });
  naar(pad);
</script>
<!-- Dezelfde bestanden, in dezelfde volgorde als manifest.json -->
<script src="../extensie/gedeeld.js"></script>
<script src="../extensie/status.js"></script>
<script src="../extensie/ec-overzicht.js"></script>
<script src="../extensie/statuskaart.js"></script>
<script src="../extensie/assessment-aside.js"></script>
<script src="../extensie/assessmentlijst.js"></script>
</body>
</html>
